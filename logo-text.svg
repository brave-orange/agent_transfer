<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="512" rx="96" ry="96" fill="#0f172a"/>

  <!-- Left node (source) -->
  <circle cx="220" cy="256" r="72" fill="none" stroke="url(#grad1)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="220" cy="256" r="56" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
  <circle cx="220" cy="256" r="20" fill="url(#grad1)"/>

  <!-- Right node (destination) -->
  <circle cx="420" cy="256" r="72" fill="none" stroke="url(#grad2)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="420" cy="256" r="56" fill="none" stroke="url(#grad2)" stroke-width="3" opacity="0.5"/>
  <circle cx="420" cy="256" r="20" fill="url(#grad2)"/>

  <!-- Arrow: left to right (top) -->
  <path d="M 272 216 L 320 216" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <polygon points="312,208 324,216 312,224" fill="#6366f1"/>

  <!-- Arrow: right to left (bottom) -->
  <path d="M 320 296 L 272 296" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <polygon points="280,288 268,296 280,304" fill="#06b6d4"/>

  <!-- Data packets on arrows -->
  <circle cx="296" cy="216" r="5" fill="#a78bfa"/>
  <circle cx="296" cy="296" r="5" fill="#67e8f9"/>

  <!-- Text: Agent Transfer -->
  <text x="320" y="420" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Agent</text>
  <text x="320" y="468" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="48" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="4">TRANSFER</text>
</svg>
